name: Shopify Live Smoke Test

on:
  workflow_dispatch:
    inputs:
      api_version:
        description: Shopify GraphQL Admin API version
        required: false
        default: 2026-07
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Shopify live smoke test
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_API_VERSION: ${{ inputs.api_version }}
        run: node commerce-connector/adapters/shopify/live-smoke.mjs
