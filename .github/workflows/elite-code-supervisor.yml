# Central Elite Code worker + Code Progress Supervisor
name: elite-code-supervisor

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: easy-elite-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    uses: salamou1944/agent-skills/.github/workflows/elite-code-reusable-supervisor.yml@main
    secrets: inherit
    with:
      goal: >-
        Act as the autonomous principal engineer for EASY. Inspect the real repository state first and obey
        PROJECT-RULES.md. Select the highest-value unfinished capability from the EASY queue and actually build
        it; do not merely audit, describe, or mark an existing passing test as completion. Prefer practical,
        sellable functionality over polish. For each change: implement the smallest coherent capability, add
        task-specific acceptance tests, run the full relevant verification, inspect the resulting behavior,
        repair regressions, and leave concrete evidence. Preserve product identity, colors, text and logos in
        creative workflows. Do not modify CI workflows, secrets, credentials, authentication policy, or
        deployment configuration. If no LLM provider is available, never fabricate completion: perform only
        deterministic repository-native engineering that can be proven, then emit an exact blocked handoff for
        the remaining provider-dependent capability. ARMY-14 pipeline evidence is never task completion.
    permissions:
      contents: write
      id-token: write
      models: read
      copilot-requests: write
