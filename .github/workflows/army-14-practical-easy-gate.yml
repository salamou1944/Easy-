name: ARMY-14 practical EASY background

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write
  models: read
  copilot-requests: write

# Keep top-level scheduled/manual runs serialized per repository; worker-job
# concurrency is independently scoped by repository, run ID, and role below.
concurrency:
  group: army-14-easy-background
  cancel-in-progress: false

jobs:
  practical:
    name: ${{ matrix.role }} background soldier
    permissions:
      contents: write
      id-token: write
      models: read
      copilot-requests: write
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        include:
          - {role: Architect, mission: Act as the ARMY-14 Architect soldier. Inspect EASY and PROJECT-RULES.md first. Make one safe, concrete architecture improvement that removes a real blocker. Run relevant verification. Never change CI, secrets, credentials, auth policy, or deployment configuration.}
          - {role: Builder, mission: Act as the ARMY-14 Builder soldier. Inspect EASY and PROJECT-RULES.md first. Implement the smallest genuinely useful unfinished EASY capability end-to-end. Run relevant verification. Never change CI, secrets, credentials, auth policy, or deployment configuration.}
          - {role: UI-UX, mission: Act as the ARMY-14 UI/UX soldier. Inspect EASY and PROJECT-RULES.md first. Implement one concrete seller-facing usability or accessibility improvement. Run relevant verification. Never change CI, secrets, credentials, auth policy, or deployment configuration.}
          - {role: Backend-API, mission: Act as the ARMY-14 Backend/API soldier. Inspect EASY and PROJECT-RULES.md first. Harden or implement one concrete incomplete API capability or boundary. Run relevant tests. Never change CI, secrets, credentials, auth policy, or deployment configuration.}
          - {role: Database, mission: Act as the ARMY-14 Database soldier. Inspect EASY and PROJECT-RULES.md first. Implement one safe applicable data-integrity improvement. Run relevant verification. Never change CI, secrets, credentials, auth policy, or deployment configuration.}
          - {role: Security, mission: Act as the ARMY-14 Security soldier. Inspect EASY and PROJECT-RULES.md first. Fix one concrete actionable security issue if present, otherwise perform the strongest meaningful security verification. Run relevant checks. Never add secrets or change auth policy.}
          - {role: Integration, mission: Act as the ARMY-14 Integration soldier. Inspect EASY and PROJECT-RULES.md first. Exercise provider boundaries using fixtures where credentials are unavailable and fix one concrete integration defect if present. Run relevant verification.}
          - {role: AI-Agent, mission: Act as the ARMY-14 AI Agent soldier. Inspect EASY and PROJECT-RULES.md first. Implement one concrete reliability or autonomy improvement in agent/operator surfaces. Run relevant verification. Never change CI, secrets, credentials, auth policy, or deployment configuration.}
          - {role: Test-QA, mission: Act as the ARMY-14 Test/QA soldier. Inspect EASY and PROJECT-RULES.md first. Add or strengthen one practical regression test around an EASY capability or real defect and run it. Never change CI, secrets, credentials, auth policy, or deployment configuration.}
          - {role: Browser-E2E, mission: Act as the ARMY-14 Browser/E2E soldier. Inspect EASY and PROJECT-RULES.md first. Execute or create one safe browser/E2E smoke path appropriate to the repository and verify it. Never change CI, secrets, credentials, auth policy, or deployment configuration.}
          - {role: Debug-Repair, mission: Act as the ARMY-14 Debug/Repair soldier. Inspect EASY and PROJECT-RULES.md first. Find one real defect or inconsistency, repair the root cause, and run verification. Never change CI, secrets, credentials, auth policy, or deployment configuration.}
          - {role: Deployment-Ops, mission: Act as the ARMY-14 Deployment/Ops soldier. Inspect EASY and PROJECT-RULES.md first. Improve one repository-supported runtime/deployment reliability issue without touching secrets or deployment policy. Run relevant verification.}
          - {role: Product-MVP, mission: Act as the ARMY-14 Product/MVP soldier. Inspect EASY and PROJECT-RULES.md first. Improve one real seller/customer MVP outcome in a usable, sellable path. Run relevant verification. Never change CI, secrets, credentials, auth policy, or deployment configuration.}
          - {role: Research-Capability, mission: Act as the ARMY-14 Research/Capability soldier. Inspect EASY and PROJECT-RULES.md first. Discover one evidence-backed capability gap or reusable opportunity and implement a safe applicable improvement. Run relevant verification. Never change CI, secrets, credentials, auth policy, or deployment configuration.}
    uses: salamou1944/agent-skills/.github/workflows/elite-code-reusable-supervisor.yml@3706023f72c2c6eb45f6315772ae168000ed415d
    secrets: inherit
    with:
      goal: ${{ matrix.mission }}
      role: ${{ matrix.role }}
      persist_to_isolated_branch: true

  integrate:
    name: Integrate verified ARMY-14 changes
    needs: practical
    if: ${{ needs.practical.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Checkout manifest validator
        uses: actions/checkout@v6
        with:
          repository: salamou1944/agent-skills
          ref: 3706023f72c2c6eb45f6315772ae168000ed415d
          path: .army-tools
          sparse-checkout: scripts/army-14-manifest.mjs
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Require exactly one verified result for every role
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          roles=(Architect Builder UI-UX Backend-API Database Security Integration AI-Agent Test-QA Browser-E2E Debug-Repair Deployment-Ops Product-MVP Research-Capability)
          expected=()
          for role in "${roles[@]}"; do
            slug="$(node .army-tools/scripts/army-14-manifest.mjs role-slug --role "$role")"
            expected+=("army/${RUN_ID}/${slug}")
          done
          mapfile -t branches < <(git ls-remote --heads origin "refs/heads/army/${RUN_ID}/"'*' | awk '{sub("refs/heads/", "", $2); print $2}' | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${#branches[@]}" -ne 14 ]] || [[ "$(printf '%s\n' "${branches[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]]; then
            echo "Expected exactly 14 role branches for run ${RUN_ID}; found ${#branches[@]}." >&2
            exit 1
          fi
          printf '[]\n' > /tmp/army-14-records.json
          for role in "${roles[@]}"; do
            slug="$(node .army-tools/scripts/army-14-manifest.mjs role-slug --role "$role")"
            branch="army/${RUN_ID}/${slug}"
            git fetch origin "$branch"
            manifest_path="$(node .army-tools/scripts/army-14-manifest.mjs manifest-path --run-id "$RUN_ID" --role "$role")"
            manifest="$(git show "origin/$branch:${manifest_path}")"
            tip="$(git rev-parse "origin/$branch")"
            task_commit="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).commit)' "$manifest")"
            test "$(git rev-parse "${tip}^1")" = "$task_commit"
            git merge-base --is-ancestor "$task_commit" "origin/$branch"
            MANIFEST="$manifest" BRANCH="$branch" TIP="$tip" PARENT="$task_commit" node -e 'const fs=require("fs");const p="/tmp/army-14-records.json";const x=JSON.parse(fs.readFileSync(p,"utf8"));x.push({manifest:JSON.parse(process.env.MANIFEST),branch:process.env.BRANCH,tip:process.env.TIP,parentCommit:process.env.PARENT});fs.writeFileSync(p,JSON.stringify(x));'
          done
          node scripts/army-14-integration.mjs validate --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --records /tmp/army-14-records.json --validator .army-tools/scripts/army-14-manifest.mjs --pins /tmp/army-14-pins.json
          printf '%s\n' "Exactly one valid VERIFIED result found for all ${#roles[@]} roles."
      - name: Build and verify complete integration candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("/tmp/army-14-pins.json","utf8"));if(p.length!==14)throw new Error("pinned_set_incomplete");fs.writeFileSync("/tmp/army-14-expected-tips.tsv",p.map(x=>`${x.branch}\t${x.tip}`).join("\n")+"\n");'
          mapfile -t expected_branches < <(cut -f1 /tmp/army-14-expected-tips.tsv | sort)
          mapfile -t current_branches < <(git ls-remote --heads origin "refs/heads/army/${{ github.run_id }}/"'*' | awk '{sub("refs/heads/", "", $2); print $2}' | sort)
          test "$(printf '%s\n' "${expected_branches[@]}")" = "$(printf '%s\n' "${current_branches[@]}")"
          while IFS=$'\t' read -r branch expected_tip; do
            current_tip="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            test "$current_tip" = "$expected_tip"
            git fetch origin "$branch"
            fetched_tip="$(git rev-parse FETCH_HEAD)"
            test "$fetched_tip" = "$expected_tip"
            git merge --no-ff --no-edit "$expected_tip"
          done < /tmp/army-14-expected-tips.tsv
          mapfile -t final_branches < <(git ls-remote --heads origin "refs/heads/army/${{ github.run_id }}/"'*' | awk '{sub("refs/heads/", "", $2); print $2}' | sort)
          test "$(printf '%s\n' "${expected_branches[@]}")" = "$(printf '%s\n' "${final_branches[@]}")"
          while IFS=$'\t' read -r branch expected_tip; do
            current_tip="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            test "$current_tip" = "$expected_tip"
          done < /tmp/army-14-expected-tips.tsv
      - name: Final integration verification
        run: |
          set -euo pipefail
          git diff --check
          if [ -f package.json ]; then
            npm ci --ignore-scripts
            npm test --if-present
            npm run test:elite:provider-resilience --if-present
          fi
      - name: Preserve integration candidate without changing main
        run: echo 'Complete integration candidate verified locally; no branch or main ref was pushed.'

