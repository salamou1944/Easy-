name: ARMY-14 practical EASY gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  practical:
    name: ${{ matrix.role }} practical test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {role: Architect, profile: .github/agents/01-architect-soldier.agent.md, mission: Inspect EASY as a real product and implement one safe architecture improvement that removes a concrete blocker, then verify it.}
          - {role: Builder, profile: .github/agents/02-builder-soldier.agent.md, mission: Identify the smallest genuinely useful unfinished EASY capability and implement it end-to-end, then verify it.}
          - {role: UI-UX, profile: .github/agents/03-ui-ux-soldier.agent.md, mission: Implement one concrete seller-facing usability/accessibility improvement supported by the current EASY repository, then verify it.}
          - {role: Backend-API, profile: .github/agents/04-backend-api-soldier.agent.md, mission: Inspect EASY APIs/contracts and implement or harden one concrete incomplete backend capability or boundary, then test it.}
          - {role: Database, profile: .github/agents/05-database-soldier.agent.md, mission: Inspect EASY data contracts and implement one safe applicable data-integrity improvement, then verify it.}
          - {role: Security, profile: .github/agents/06-security-soldier.agent.md, mission: Perform a practical security pass, fix one concrete actionable issue if present, and verify the fix.}
          - {role: Integration, profile: .github/agents/07-integration-soldier.agent.md, mission: Exercise EASY provider boundaries using fixtures where credentials are unavailable; fix one concrete integration defect if present and verify it.}
          - {role: AI-Agent, profile: .github/agents/08-ai-agent-soldier.agent.md, mission: Implement one concrete reliability or autonomy improvement in EASY's agent/operator surfaces, then verify it.}
          - {role: Test-QA, profile: .github/agents/09-test-qa-soldier.agent.md, mission: Build or strengthen one practical regression test around an EASY capability or discovered defect, run it, and verify the signal.}
          - {role: Browser-E2E, profile: .github/agents/10-browser-e2e-soldier.agent.md, mission: Inspect EASY browser/E2E surfaces and run or create one safe executable smoke path where appropriate, then verify it.}
          - {role: Debug-Repair, profile: .github/agents/11-debug-repair-soldier.agent.md, mission: Find one real defect or inconsistency in EASY, repair the root cause, and run verification.}
          - {role: Deployment-Ops, profile: .github/agents/12-deployment-ops-soldier.agent.md, mission: Inspect EASY runtime/deployment artifacts without touching secrets; fix one concrete repository-supported reliability defect and verify it.}
          - {role: Product-MVP, profile: .github/agents/13-product-mvp-soldier.agent.md, mission: Evaluate a real seller/customer MVP outcome and implement one concrete improvement to a usable/sellable path, then verify it.}
          - {role: Research-Capability, profile: .github/agents/14-research-capability-soldier.agent.md, mission: Discover one evidence-backed capability gap or reusable opportunity in EASY, implement a safe applicable improvement, and verify it.}

    steps:
      - name: Checkout EASY
        uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Checkout ARMY-14 skills
        uses: actions/checkout@v6
        with:
          repository: salamou1944/agent-skills
          ref: main
          path: .elite-code-tools
          fetch-depth: 1
      - name: Load soldier profile and goal
        run: |
          set -euo pipefail
          test -f ".elite-code-tools/${{ matrix.profile }}"
          cp ".elite-code-tools/${{ matrix.profile }}" /tmp/soldier-profile.md
          cat > /tmp/soldier-goal.txt <<'EOF'
          You are the ARMY-14 ${{ matrix.role }} soldier operating at the Elite capability stage.
          This is a PRACTICAL execution test against the real EASY repository, not documentation.
          Read PROJECT-RULES.md first and obey it. Your authoritative role profile is in /tmp/soldier-profile.md.
          Mission: ${{ matrix.mission }}
          Inspect the actual repository before acting. Make safe repository-supported changes only. Never add secrets or credentials. Never modify CI workflows, authentication policy, deployment configuration, or secrets. Do not commit or push. If no implementation change is justified, perform the strongest meaningful verification and document why. Run relevant tests/checks.
          Your final output must be JSON in the autonomous-coder format and must accurately state whether the practical change was verified.
          EOF
      - name: Run soldier directly through Elite provider ladder
        id: soldier
        continue-on-error: true
        env:
          EASY_OPERATOR_LLM_API_KEY: ${{ secrets.EASY_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
          EASY_OPERATOR_LLM_ENDPOINT: ${{ vars.EASY_OPERATOR_LLM_ENDPOINT || 'https://api.openai.com/v1/chat/completions' }}
          EASY_OPERATOR_LLM_MODEL: ${{ vars.EASY_OPERATOR_LLM_MODEL || 'gpt-4o-mini' }}
          EASY_OPERATOR_LLM_FALLBACK_MODEL: ${{ vars.EASY_OPERATOR_LLM_FALLBACK_MODEL || '' }}
          EASY_OPERATOR_SECONDARY_LLM_ENDPOINT: ${{ vars.EASY_OPERATOR_SECONDARY_LLM_ENDPOINT || '' }}
          EASY_OPERATOR_SECONDARY_LLM_MODEL: ${{ vars.EASY_OPERATOR_SECONDARY_LLM_MODEL || '' }}
          EASY_OPERATOR_SECONDARY_LLM_API_KEY: ${{ secrets.EASY_SECONDARY_LLM_API_KEY || '' }}
          EASY_OPERATOR_GITHUB_MODELS_ENDPOINT: ''
          EASY_OPERATOR_GITHUB_MODELS_MODEL: ''
          EASY_OPERATOR_CODER_ATTEMPTS: '2'
          EASY_OPERATOR_PROVIDER_RETRIES: '3'
          EASY_OPERATOR_RATE_LIMIT_MAX_WAIT_MS: '30000'
          EASY_OPERATOR_PROVIDER_TIMEOUT_MS: '60000'
          EASY_OPERATOR_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          node .elite-code-tools/apps/easy-developer-platform/autonomous-coder.mjs "$(cat /tmp/soldier-goal.txt)\n\nROLE PROFILE:\n$(cat /tmp/soldier-profile.md)" | tee /tmp/soldier-run.json
          node -e "const r=require('/tmp/soldier-run.json'); if(!['VERIFIED','VERIFIED_NOOP'].includes(r.status)) process.exit(1)"
      - name: Verify practical result
        if: always()
        run: |
          set -euo pipefail
          git diff --check
          if [ -f package.json ] && node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then npm test --if-present; fi
          if [ -f /tmp/soldier-run.json ]; then cp /tmp/soldier-run.json "soldier-result-${{ matrix.role }}.json"; else printf '{"status":"MISSING"}\n' > "soldier-result-${{ matrix.role }}.json"; fi
          git diff --stat > "diff-${{ matrix.role }}.txt" || true
          git status --short > "status-${{ matrix.role }}.txt" || true
          test "${{ steps.soldier.outcome }}" = success
          node -e "const fs=require('fs'); const p='soldier-result-${{ matrix.role }}.json'; const r=JSON.parse(fs.readFileSync(p,'utf8')); if(!['VERIFIED','VERIFIED_NOOP'].includes(r.status)) process.exit(1)"
      - name: Upload practical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: army-14-${{ matrix.role }}-evidence
          path: |
            soldier-result-${{ matrix.role }}.json
            diff-${{ matrix.role }}.txt
            status-${{ matrix.role }}.txt
